name: build

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v2
      with:
        ssh-key: ${{ secrets.DEPLOY_KEY }}
        submodules: true

    # Update references
    - name: Git Submodule Update
      run: |
        git pull --recurse-submodules
        git submodule update --remote --recursive

    # 从 Laws 的数据库导出法律的状态、版本、排序和统计，模板读取 data/laws.json
    # 部署时 hugo-deploy 会重新克隆仓库，所以这个文件要和子模块引用一起提交
    - name: Export law metadata
      run: |
        python3 scripts/export_meta.py content/docs data/laws.json

    - name: Commit update
      run: |
        git config --global user.email "bot@github.com"
        git config --global user.name "Bot"
        git add data/laws.json
        git commit -am "Auto updated submodule references" && git push || echo "No changes to commit"

    - name: 'Building...'
      uses: reuixiy/hugo-deploy@v1
      env:
        DEPLOY_REPO: LawRefBook/lawrefbook.github.io
        DEPLOY_BRANCH: build
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        TZ: Asia/Shanghai

    - name: "Sending Notification"
      uses: fjogeleit/http-request-action@master
      with:
        url: ${{ secrets.NOTICE_URL }}